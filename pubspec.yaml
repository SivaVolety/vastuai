name: vastuai
description: "VasthuAI: floor-plan insights with computer vision and traditional Vastu rules."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image: ^4.1.3
  path_provider: ^2.1.2
  image_picker: ^1.1.2
  http: ^1.4.0
  path: ^1.9.1
  shared_preferences: ^2.2.2
  provider: ^6.1.5
  url_launcher: ^6.3.3
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/siva_profile.png
    - web/icons/vastuai-mark.svg
    - assets/fonts/DMSerifDisplay-OFL.txt
    - assets/fonts/Lato-OFL.txt
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
